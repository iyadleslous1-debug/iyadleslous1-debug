<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" width="1120" height="350" role="img" aria-labelledby="title desc">
  <title id="title">Iyad — Big dreams. Starting early.</title>
  <desc id="desc">White typography over a midnight backdrop with a violet wireframe sphere.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#0D0E15"/>
      <stop offset="1" stop-color="#17142A"/>
    </linearGradient>
    <radialGradient id="glow" cx=".76" cy=".43" r=".46">
      <stop stop-color="#6553C6" stop-opacity=".26"/>
      <stop offset="1" stop-color="#6553C6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wire" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#423979"/>
      <stop offset=".62" stop-color="#9580FF"/>
      <stop offset="1" stop-color="#D5CBFF"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#B5A6F7" stroke-opacity=".075"/>
    </pattern>
    <clipPath id="edge">
      <rect width="1120" height="350" rx="14"/>
    </clipPath>
    <mask id="grid-fade">
      <rect width="1120" height="350" fill="url(#grid-opacity)"/>
    </mask>
    <linearGradient id="grid-opacity">
      <stop offset=".36" stop-color="#000"/>
      <stop offset=".75" stop-color="#fff"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#edge)">
    <rect width="1120" height="350" fill="url(#backdrop)"/>
    <rect width="1120" height="350" fill="url(#glow)"/>
    <rect width="1120" height="350" fill="url(#grid)" mask="url(#grid-fade)"/>
    <g transform="translate(838 176)">
      <circle r="151" fill="none" stroke="#9B8AE7" stroke-opacity=".25" stroke-dasharray="2 6"/>
      <circle r="137" fill="none" stroke="#9B8AE7" stroke-opacity=".25"/>
      <path d="M-174 0H174M0-163V163" stroke="#9B8AE7" stroke-opacity=".23" stroke-dasharray="3 6"/>
      <g transform="rotate(-29)" fill="none" stroke="url(#wire)" stroke-width="1.3">
        <circle r="118"/>
        <ellipse rx="91" ry="118"/>
        <ellipse rx="53" ry="118"/>
        <ellipse rx="17" ry="118"/>
        <path d="M0-118V118" opacity=".52"/>
        <ellipse rx="118" ry="42"/>
        <ellipse rx="105" ry="31" cy="-48" opacity=".7"/>
        <ellipse rx="105" ry="31" cy="48" opacity=".7"/>
        <ellipse rx="72" ry="18" cy="-84" opacity=".65"/>
        <ellipse rx="72" ry="18" cy="84" opacity=".65"/>
      </g>
      <g transform="rotate(-29)">
        <ellipse rx="189" ry="47" fill="none" stroke="#B4A6FB" stroke-opacity=".48" stroke-width="1.2"/>
        <circle cx="167" cy="-22" r="3.5" fill="#D3C8FF"/>
        <circle cx="-132" cy="34" r="2" fill="#B4A6FB"/>
      </g>
      <path d="M0-153v7M0 146v7M-153 0h7M146 0h7" stroke="#C7B8FF" stroke-opacity=".67"/>
      <circle cx="151" cy="-104" r="2" fill="#BAAFF3" fill-opacity=".8"/>
      <circle cx="-195" cy="63" r="1.5" fill="#BAAFF3" fill-opacity=".6"/>
      <circle cx="210" cy="84" r="1.5" fill="#BAAFF3" fill-opacity=".6"/>
    </g>
    <path d="M70 80H114" stroke="#BBABFF" stroke-width="3"/>
    <text x="67" y="197" fill="#F7F4FF" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="116" letter-spacing="-5">IYAD</text>
    <text x="72" y="246" fill="#CFC4F5" font-family="Arial, Helvetica, sans-serif" font-size="29">Big dreams. Starting early.</text>
  </g>
  <rect x=".5" y=".5" width="1119" height="349" rx="13.5" fill="none" stroke="#AFA0F3" stroke-opacity=".3"/>
</svg>
